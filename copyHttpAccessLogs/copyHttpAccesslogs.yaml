---
#######################################################################################################
## Copy the http access logs from the HCL DX pods to a configured directory
##
## Note: Make sure you setup visudo correctly so that "sudo -i -u <become_user>" works
#######################################################################################################
- name: Copy http access logs
  hosts: crchosts
  become: no
  become_user: "{{ oscpOsUser }}"
  gather_facts: true
  force_handlers: true
  module_defaults:
    kubernetes.core.k8s:
      validate_certs: "no"
    kubernetes.core.k8s_info:
      validate_certs: "no"
    kubernetes.core.k8s_exec:
      validate_certs: "no"
    kubernetes.core.k8s_cp:
      validate_certs: "no"
    community.okd.openshift_auth:
      validate_certs: "no"
    community.okd.openshift_process:
      validate_certs: "no"
    community.okd.openshift_route:
      validate_certs: "no"
  #########################
  ## Tasks of the play-book
  #########################
  tasks:
    - name: Send notification message via Slack that backup started
      community.general.slack:
        token: "{{ slackAuthenticationToken }}"
        msg: "Copying HTTP access for the core pods to {{ backupBaseDir  }} started"
      when: ((sendSlackNotifications is defined) and (sendSlackNotifications == true))
      tags:
        - always

    - name: Set K8S login facts
      ansible.builtin.include_tasks: k8slogin.yaml
      tags:
        - always

    - name: Retrieving the current timestamp
      ansible.builtin.set_fact:
        backup_timestamp: "{{ ansible_date_time.iso8601_basic_short }}"
      tags:
        - always

    - name: Dump API Key in MAIN
      ansible.builtin.debug:
        msg:
          - "API Key is: {{ kube_api_key  }}"
          - "OCP Host is: {{ k8s_host  }}"
        verbosity: 4
      tags:
        - always

    - name: Login to the oc client using the API key
      ansible.builtin.command:
        argv:
          - "{{ oscpClientBin | default('/usr/local/bin/oc') }}"
          - "login"
          - "--token={{ kube_api_key }}"
          - "--server={{ k8s_host }}"
          - "--insecure-skip-tls-verify"
      register: cmdResult
      ##### failed_when: (cmdResult.rc != 0)
      tags:
        - always

    - name: Debug the command result of 'oc login'
      ansible.builtin.debug:
        msg:
          - "cmdResult is {{ cmdResult }}"
        verbosity: 2
      tags:
        - always

    - name: Iterate over the configured deployments
      ansible.builtin.include_tasks:
        file: moveFilesForNamespace.yaml
      loop: "{{ oscpNamespaces }}"
      loop_control:
        loop_var: namespace
      tags:
        - always

    ##
    ## Perform the oc logout
    - name: Logout of the command line client
      ansible.builtin.command:
        argv:
          - "{{ oscpClientBin | default('/usr/local/bin/oc') }}"
          - "--token={{ kube_api_key }}"
          - "--server={{ k8s_host }}"
          - "--insecure-skip-tls-verify"
          - "logout"
      when: ((oscpLogoutOfOc is defined) and
        (oscpLogoutOfOc | bool))
      tags:
        - always
    ##
    ## Logout
    - name: If login succeeded, try to log out (revoke access token)
      community.okd.openshift_auth:
        host: "{{ k8s_host }}"
        state: absent
        api_key: "{{ kube_api_key }}"
        validate_certs: "no"
      when: kube_api_key is defined
      register: ocpLogoutResult
      ignore_errors: true
      tags:
        - always
    ##
    ## Send slack notifications that playbook has finished
    - name: Send notification message via Slack that backup finished
      community.general.slack:
        token: "{{ slackAuthenticationToken }}"
        msg: "Copying HTTP access for the core pods to {{ backupBaseDir  }} finished"
      when: ((sendSlackNotifications is defined) and (sendSlackNotifications == true))
      tags:
        - Always
